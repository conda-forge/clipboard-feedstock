schema_version: 1

context:
  name: clipboard
  version: "1.0.0"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/${{ name[0] }}/${{ name }}/clipboard-${{ version }}.tar.gz
  sha256: 5c3c8528d67a4c52b3bf63fb1ff66a929184895154db3c550326726af6f8ff8d

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=77
    - wheel
  run:
    - python >=${{ python_min }}
    - pyperclip >=1.8.2,<2

tests:
  - python:
      imports:
        - clipboard
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  summary: A cross platform clipboard operation library of Python. Works for Windows, Mac and Linux.
  license: MIT
  license_file: LICENSE
  homepage: https://github.com/terryyin/clipboard

extra:
  recipe-maintainers:
    - thewchan
