schema_version: 1

context:
  name: clipboard
  version: "0.0.5"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/${{ name[0] }}/${{ name }}/clipboard-${{ version }}.tar.gz
  sha256: f0708beb50c151333505de9c3428f5d0b547dcf401761a6b84146b30abe7babf

build:
  number: 1
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=77
    - wheel
  run:
    - python >=${{ python_min }}
    - pyperclip >=1.8.2,<2

tests:
  - python:
      imports:
        - clipboard
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  summary: A cross platform clipboard operation library of Python. Works for Windows, Mac and Linux.
  license: MIT
  license_file: LICENSE
  homepage: https://github.com/terryyin/clipboard

extra:
  recipe-maintainers:
    - thewchan
