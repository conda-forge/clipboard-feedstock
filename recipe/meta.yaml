{% set name = "clipboard" %}
{% set version = "0.0.5" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/{{ name[0] }}/{{ name }}/clipboard-{{ version }}.tar.gz
  sha256: f0708beb50c151333505de9c3428f5d0b547dcf401761a6b84146b30abe7babf

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv
  number: 0

requirements:
  host:
    - python {{ python_min }}.*
    - pip
    - setuptools >=77
    - wheel
  run:
    - python >={{ python_min }}
    - pyperclip >=1.8.2,<2

test:
  imports:
    - clipboard
  commands:
    - pip check
  requires:
    - pip
    - python {{ python_min }}.*

about:
  home: https://github.com/terryyin/clipboard
  summary: A cross platform clipboard operation library of Python. Works for Windows, Mac and Linux.
  license: MIT
  license_file: LICENSE

extra:
  recipe-maintainers:
    - thewchan
